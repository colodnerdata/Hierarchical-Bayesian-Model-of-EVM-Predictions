[build-system]
requires = ["hatchling>=1.33.0,<2"]
build-backend = "hatchling.build"

[project]
name = "project-name"
version = "0.1.0"
description = "Replace with a one-sentence project description"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "poethepoet>=0.49.0,<1",
    "pytest>=9.2.0,<10",
    "ruff>=0.17.3,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/project_name"]

[tool.poe.env]
UV_LOCKED = "1"

# Shortcuts for the owner. Automated layers (CI, the git hook, Claude Code
# hooks) call the uv commands in docs/DEVELOPMENT.md directly.
[tool.poe.tasks]
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
test = "pytest -m 'not property'"
check = ["lint", "format-check", "test"]
setup = [
    { cmd = "uv sync --locked" },
    { cmd = "git config core.hooksPath .githooks" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "property: property-based tests, run as their own CI job once they exist",
]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
